name: Monthly shared-picture enrichment

# Monthly refresh of the UC "shared picture": re-fetches known sources, runs a
# full entity×dimension discovery sweep, and writes changesets under
# data/enrich/changesets/.
#
# Each run produces up to two lanes per target:
#
#   {id}-auto.md   Changes that met the automatic policy (see lib/enrich/diff.ts).
#                  Applied by this job, unattended, with no human sign-off.
#                  Disable with the auto_apply input or ENRICH_AUTO_APPLY=0.
#
#   {id}.md        Everything else — every value mutation, anything below high
#                  confidence, anything flagged, and all committee changes.
#                  Left as a draft for review at /admin/enrich; nothing in this
#                  lane touches canonical data until a human approves it there.
#
# Required repo secret:
#   LITELLM_API_KEY  — TritonAI bearer token for discovery + extraction
#
# Coexists with .github/workflows/committee-scan.yml: that runs daily at 13:00
# UTC and weekly Sundays at 14:00 UTC; this runs at 11:00 UTC on the 1st of the
# month — a distinct hour and day so the commit/push loops never collide.

on:
  schedule:
    - cron: "0 11 1 * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Which surface to enrich"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - baseline
          - peer
          - committee
      lookback_days:
        description: "Discovery lookback window in days (default 35)"
        required: false
        default: "35"
        type: string
      full_sweep:
        description: "Full entity×dimension sweep (off = changed cells only)"
        required: false
        default: true
        type: boolean
      auto_apply:
        description: "Apply the automatic lane (off = everything waits for review)"
        required: false
        default: true
        type: boolean
      dry_run:
        description: "Build and print changesets without writing/committing"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# Shared with enrich-apply.yml: both write data/ and push, so they must never
# interleave.
concurrency:
  group: enrich-write
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Real token so the post-step git push goes through.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate baseline (pre-flight gate)
        run: npm run validate:baseline

      - name: Run monthly enrichment (propose only)
        env:
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          LITELLM_BASE_URL: ${{ vars.LITELLM_BASE_URL }}
          ENRICH_MODEL: ${{ vars.ENRICH_MODEL }}
          EXTRACT_MODEL: ${{ vars.EXTRACT_MODEL }}
          TARGET: ${{ inputs.target || 'all' }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '35' }}
          FULL_SWEEP: ${{ inputs.full_sweep == false && '0' || '1' }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
          # Off means no auto lane is generated at all, so everything lands in
          # the review queue rather than being written and then skipped.
          ENRICH_AUTO_APPLY: ${{ inputs.auto_apply == false && '0' || '1' }}
        run: npm run enrich:monthly

      - name: Validate generated changesets
        if: ${{ inputs.dry_run != true }}
        run: npm run validate:baseline

      # Apply the automatic lane before committing, so proposals and any
      # unattended changes land in the same push and trigger one rebuild.
      # ENRICH_AUTO_APPLY=0 (or auto_apply: false) skips this entirely.
      - name: Apply the automatic lane
        id: autoapply
        if: ${{ inputs.dry_run != true }}
        continue-on-error: true
        env:
          ENRICH_AUTO_APPLY: ${{ inputs.auto_apply == false && '0' || '1' }}
        run: npm run enrich:apply -- --auto-lane

      - name: Validate after the automatic lane
        id: postvalidate
        if: ${{ inputs.dry_run != true }}
        continue-on-error: true
        run: npm run validate:baseline

      # A bad auto-apply must never block the human queue from landing. If
      # either step above failed, throw away the canonical edits and keep the
      # proposals — they are the durable artifact and the reason for the run.
      - name: Discard the automatic lane if it did not validate
        if: ${{ inputs.dry_run != true && (steps.autoapply.outcome == 'failure' || steps.postvalidate.outcome == 'failure') }}
        run: |
          echo "::error::The automatic lane failed to apply or validate; discarding it and keeping the proposals."
          git checkout -- data/uc_ai_baseline.json data/peer_ai_baseline.json \
            data/uc_ai_derived.json data/ENRICHMENT_LOG.md 2>/dev/null || true
          git checkout -- data/ucnfi-committee/records/ 2>/dev/null || true
          # Mark the lane so the next run does not silently retry the same thing.
          for f in data/enrich/changesets/*-auto.md; do
            [ -e "$f" ] || continue
            echo "Auto lane left in place for inspection: $f"
          done

      # Commit straight to the branch, like committee-scan.yml and
      # brief-weekly.yml. Proposals change nothing users can see until they
      # are applied, so there is nothing for a PR to protect — and the draft
      # PR this replaced actively misled, since merging it published nothing.
      - name: Commit and push
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "ucnfi-enrich-bot"
          git config user.email "ucnfi-enrich-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No proposed changes to commit."
            exit 0
          fi
          MONTH=$(date -u +%Y-%m)
          git commit -m "Monthly shared-picture enrichment — $MONTH"

          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF#refs/heads/}"; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected on attempt ${attempt}; rebasing and retrying..."
            git pull --rebase --autostash origin "${GITHUB_REF#refs/heads/}" || true
            sleep "$((attempt * 2))"
          done
          echo "::error::Could not push after 5 attempts."
          exit 1

      - name: Summary
        if: ${{ always() && inputs.dry_run != true }}
        run: |
          {
            echo "### Monthly enrichment"
            echo
            for f in data/enrich/changesets/*.md; do
              [ -e "$f" ] || continue
              id="$(basename "$f" .md)"
              case "$id" in
                *-auto)
                  echo "- **$id** - applied automatically, no human sign-off" ;;
                *)
                  rev="$(grep -c 'DECISION: review' "$f" || true)"
                  [ "$rev" = "0" ] && continue
                  echo "- **$id** - $rev proposal(s) need a decision" ;;
              esac
            done
            echo
            echo "Review and publish at \`/admin/enrich\`. Nothing in the human lane"
            echo "reaches the baseline until it is approved there."
          } >> "$GITHUB_STEP_SUMMARY"
