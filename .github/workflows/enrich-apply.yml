name: Apply reviewed enrichment changeset

# Publishes a changeset a human has reviewed and signed off in the app.
#
# This is the only path that moves canonical data on a human's say-so, and it
# runs here rather than in the web app for two reasons: applying needs a real
# checkout of data/ to mutate, and data/compute_derived.py needs python3, which
# Vercel's serverless runtime does not have. The app's Publish button stamps
# reviewed_by into the changeset, commits it, then dispatches this workflow.
#
# Every gate still lives in lib/enrich/apply.ts — this job just gives it a
# machine to run on. A changeset with an empty reviewed_by fails here exactly
# as it would locally.
#
# The auto lane (*-auto) is deliberately NOT applicable here; it is applied
# unattended by baseline-enrich.yml and must never be publishable as though a
# human had reviewed it.

on:
  workflow_dispatch:
    inputs:
      changeset_id:
        description: "Changeset to apply, e.g. 2026-08 or 2026-08-peer"
        required: true
        type: string

permissions:
  contents: write

# Shared with baseline-enrich.yml: both write data/ and push, so they must
# never interleave.
concurrency:
  group: enrich-write
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Validate changeset id
        env:
          ID: ${{ inputs.changeset_id }}
        run: |
          # This value reaches a file path. Check it against the same closed
          # shape lib/enrich/changeset-format.ts enforces, and refuse the auto
          # lane outright.
          if ! printf '%s' "$ID" | grep -Eq '^[0-9]{4}-[0-9]{2}(-(peer|committee))?$'; then
            echo "::error::Invalid changeset id '$ID'."
            exit 2
          fi
          if [ ! -f "data/enrich/changesets/$ID.md" ]; then
            echo "::error::Changeset $ID does not exist on this branch."
            exit 2
          fi

      - name: Install dependencies
        run: npm ci

      - name: Validate data before applying
        run: npm run validate:baseline

      - name: Apply the changeset
        id: apply
        env:
          ID: ${{ inputs.changeset_id }}
        run: npm run enrich:apply -- --changeset "$ID"

      - name: Validate data after applying
        run: npm run validate:baseline

      - name: Commit and push
        env:
          ID: ${{ inputs.changeset_id }}
        run: |
          git config user.name "ucnfi-enrich-bot"
          git config user.email "ucnfi-enrich-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nothing changed — the changeset had no approved changes."
            exit 0
          fi
          git commit -m "Apply reviewed enrichment changeset — $ID"

          # The monthly run and the manual activity flow also push here, so a
          # rebase-and-retry loop rather than a plain push. Same shape as
          # committee-scan.yml.
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF#refs/heads/}"; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected on attempt ${attempt}; rebasing and retrying…"
            git pull --rebase --autostash origin "${GITHUB_REF#refs/heads/}" || true
            sleep "$((attempt * 2))"
          done
          echo "::error::Could not push after 5 attempts."
          exit 1

      - name: Summary
        if: always()
        env:
          ID: ${{ inputs.changeset_id }}
        run: |
          {
            if [ "${{ steps.apply.outcome }}" = "success" ]; then
              echo "### Applied \`$ID\`"
              echo
              echo "Canonical data updated and pushed. Vercel will rebuild."
            else
              echo "### \`$ID\` was not applied"
              echo
              echo "The apply step refused or failed — see its log above. The most"
              echo "common cause is the changeset's gate: it must be \`status: draft\`"
              echo "with a non-empty \`reviewed_by\`. Canonical data is untouched."
            fi
            echo
            echo "Review queue: /admin/enrich"
          } >> "$GITHUB_STEP_SUMMARY"
